name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # A throwaway Postgres for this run; the API tests never touch the live project.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 54322:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Database rules (in-memory Postgres)
        run: npm run test:db

      - name: Start local Supabase API (Auth + PostgREST) with the app's migrations
        run: bash tests/stack/start.sh
        env:
          PGURL: postgres://postgres:postgres@127.0.0.1:54322/postgres

      - name: API steel threads
        run: |
          set -a && . tests/stack/.env.test && set +a
          npm run test:api

      - name: Server logs (on failure)
        if: failure()
        run: tail -n 50 tests/stack/logs/*.log || true
